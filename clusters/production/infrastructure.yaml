---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-base
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base
  prune: false
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
    - name: infra-base
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/config
  prune: true
  wait: true
  patches:
    - target:
        kind: IPAddressPool
        group: metallb.io
        name: ip-address-pool
      patch: |
        - op: add
          path: /spec
          value:
            addresses:
            - "10.120.0.200/29"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-operators
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators
  prune: false
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-operators
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage
  prune: false
  wait: true
  patches:
    - target:
        kind: Ingress
        name: rook-ceph
      patch: |
        - op: replace
          path: /spec/rules/0/host
          value: rook-ceph.stplabs.io
        - op: replace
          path: /spec/tls/0/hosts/0
          value: rook-ceph.stplabs.io

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-oidc
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-storage
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/sso
  prune: false
  wait: false
  patches:
    - target:
        kind: HelmRelease
        name: authelia
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: authelia
          namespace: authelia
        spec:
          values:
            configMap:
              session:
                cookies:
                  - domain: stplabs.io
                    subdomain: oidc
              identity_providers:
                oidc:
                  clients:
                    - client_id: mealie
                      client_name: Mealie
                      client_secret:
                        value: '$6$bD.ibPj2sW9L.t75$4vCBGxM9OJlF3EKVJU5g2dii0mFMMHsIYAo4ONbKdttgT8k9BgVfW55EXXEZhfG9kkMdWPNLSNfQNo44ycc5E.'
                      public: false
                      consent_mode: implicit
                      authorization_policy: one_factor
                      redirect_uris:
                        - https://mealie.stplabs.io/login
                        - 'https://mealie.stplabs.io/login?direct=1'
                      scopes:
                        - openid
                        - profile
                        - email
                        - groups
                    - client_id: grafana
                      client_name: Grafana
                      client_secret:
                        value: '$6$n8Q5OkiFBC7XLP7v$wNrGmu53t6pspBUzRKvqM4bnkwzkc/9TabtlqpHQ8kIdUmPCwQzgZJW4B5neI46nhfVGf0jz13oua13YWo3kP1'
                      public: false
                      consent_mode: implicit
                      authorization_policy: one_factor
                      claims_policy: grafana
                      redirect_uris:
                        - https://grafana.stplabs.io/login/generic_oauth
                      scopes:
                        - openid
                        - profile
                        - email
                        - groups
    - target:
        kind: Ingress
        name: authelia-theme-proxy
      patch: |
        - op: replace
          path: /spec/rules/0/host
          value: oidc.stplabs.io
        - op: replace
          path: /spec/tls/0/hosts/0
          value: oidc.stplabs.io

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-storage
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/monitoring
  prune: true
  wait: true
  patches:
    - target:
        kind: Ingress
        name: grafana
      patch: |
        - op: replace
          path: /spec/rules/0/host
          value: grafana.stplabs.io
        - op: replace
          path: /spec/tls/0/hosts/0
          value: grafana.stplabs.io
    - target:
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
          namespace: monitoring
        spec:
          values:
            prometheus:
              prometheusSpec:
                retentionSize: 40GiB
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      resources:
                        requests:
                          storage: 50Gi
            alertmanager:
              alertmanagerSpec:
                secrets:
                  - alertmanager-slack
                storage:
                  volumeClaimTemplate:
                    spec:
                      resources:
                        requests:
                          storage: 5Gi
              config:
                global:
                  slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
                route:
                  receiver: slack-notifications
                  group_by: ['alertname', 'namespace']
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 12h
                  routes:
                    - receiver: "null"
                      matchers:
                        - alertname = "Watchdog"
                receivers:
                  - name: "null"
                  - name: slack-notifications
                    slack_configs:
                      - channel: '#monitoring-production'
                        send_resolved: true
                        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
                        text: |-
                          {{ range .Alerts }}
                          *Severity:* {{ .Labels.severity }}
                          *Summary:* {{ .Annotations.summary }}
                          *Description:* {{ .Annotations.description }}
                          {{ end }}
            grafana:
              deploymentStrategy:
                type: Recreate
              envValueFrom:
                GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
                  secretKeyRef:
                    name: grafana-oidc-secret
                    key: clientSecret
              grafana.ini:
                server:
                  root_url: https://grafana.stplabs.io
                auth.generic_oauth:
                  enabled: true
                  name: Authelia
                  allow_sign_up: true
                  auto_login: true
                  client_id: grafana
                  scopes: openid profile email groups
                  auth_url: https://oidc.stplabs.io/api/oidc/authorization
                  token_url: https://oidc.stplabs.io/api/oidc/token
                  api_url: https://oidc.stplabs.io/api/oidc/userinfo
                  login_attribute_path: preferred_username
                  groups_attribute_path: groups
                  role_attribute_path: "contains(groups, 'admins') && 'GrafanaAdmin' || 'Viewer'"
                  allow_assign_grafana_admin: true
    - target:
        kind: HelmRelease
        name: loki
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: loki
          namespace: monitoring
        spec:
          values:
            singleBinary:
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
              persistence:
                size: 100Gi

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/production/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
