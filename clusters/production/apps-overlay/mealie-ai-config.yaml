apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-ai-config
  namespace: mealie
spec:
  template:
    spec:
      containers:
        - name: reconcile
          env:
            - name: MANAGE_IMAGE_PROVIDER
              value: "true"
            - name: PROVIDER_BASE_URL
              value: https://llm.core.stplabs.io/v1
