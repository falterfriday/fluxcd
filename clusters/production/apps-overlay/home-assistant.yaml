apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  chart:
    spec:
      version: "32.0.6"
  valuesFrom:
    - kind: Secret
      name: home-assistant-db-secret
      valuesKey: password
      targetPath: cnpg.main.password
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: accessKey
      targetPath: credentials.rustfs.accessKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: secretKey
      targetPath: credentials.rustfs.secretKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: encrKey
      targetPath: credentials.rustfs.encrKey
  values:
    image:
      repository: docker.io/homeassistant/home-assistant
      tag: "2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f"
    # TEMPORARY HOTFIX (2026-10-24) - production only, until it moves to the in-house image
    # (git.core.stplabs.io/stp-labs/home-assistant), which carries the fix. Delete this block then.
    workload:
      main:
        podSpec:
          containers:
            main:
              command:
                - /bin/sh
                - -c
                - |
                  F="$(python3 -c 'import importlib.util as u; print(u.find_spec("pylutron_caseta").submodule_search_locations[0])')/smartbridge.py"
                  V="$(python3 -c 'import importlib.metadata as m; print(m.version("pylutron-caseta"))')"
                  if [ "$V" != "0.29.0" ]; then
                    echo "caseta-hotfix: pylutron-caseta is $V, not 0.29.0 - skipping; remove this hotfix from the HelmRelease"
                  elif grep -q 'ssl_context.check_hostname = False' "$F"; then
                    echo "caseta-hotfix: already applied"
                  elif grep -q '^ *ssl_context.verify_mode = ssl.CERT_REQUIRED$' "$F"; then
                    sed -i 's/^\( *\)ssl_context.verify_mode = ssl.CERT_REQUIRED$/&\n\1ssl_context.check_hostname = False/' "$F" && echo "caseta-hotfix: applied to $F"
                  else
                    echo "caseta-hotfix: WARNING patch target not found in $F - starting unpatched"
                  fi
                  exec /init
    ingress:
      main:
        hosts:
          - host: home-assistant.external.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - home-assistant.external.stplabs.io
            secretName: home-assistant-tls
    credentials:
      rustfs:
        type: s3
        url: https://rustfs.core.stplabs.io
        bucket: cnpg-home-assistant
        path: "production"
        region: us-east-1
    cnpg:
      main:
        cluster:
          storage:
            size: 10Gi
          walStorage:
            size: 5Gi
        backups:
          enabled: true
          credentials: rustfs
          retentionPolicy: "30d"
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
