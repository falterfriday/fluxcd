apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps
  - ../../../apps/mealie-ai-config
  - ../../../apps/mealie-gkeep-sync
  - ../../../apps/opengym
configMapGenerator:
  - name: home-assistant-packages
    namespace: home-assistant
    behavior: merge
    files:
      - home-assistant-packages/voice_assistants.yaml
      - home-assistant-packages/dashboards.yaml
    options:
      disableNameSuffixHash: true
  - name: home-assistant-dashboards
    namespace: home-assistant
    files:
      - home-assistant-dashboards/home.yaml
    options:
      disableNameSuffixHash: true
patches:
  - path: mealie.yaml
    target:
      kind: HelmRelease
      name: mealie
  - path: home-assistant.yaml
    target:
      kind: HelmRelease
      name: home-assistant
  - path: mealie-ai-config.yaml
    target:
      kind: Job
      name: mealie-ai-config
  - path: mealie-gkeep-sync.yaml
    target:
      kind: HelmRelease
      name: mealie-gkeep-sync
  - path: opengym.yaml
    target:
      kind: HelmRelease
      name: opengym
