apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  chart:
    spec:
      version: "29.0.0"
  values:
    mealie:
      api:
        general:
          base_url: https://mealie.stplabs.io
        oidc:
          auth_enabled: true
          signup_enabled: true
          configuration_url: https://sso.core.stplabs.io/application/o/mealie/.well-known/openid-configuration
          client_id: mealie
          user_group: platform-users
          admin_group: platform-admins
          provider_name: STP Labs
          remember_me: true
          auto_redirect: true
    ingress:
      main:
        hosts:
          - host: mealie.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mealie.stplabs.io
            secretName: mealie-tls
    persistence:
      data:
        size: 1Gi
        retain: true
        targetSelector:
          main:
            main:
              mountPath: /app/data
      nltk:
        enabled: true
        retain: true
        size: 1Gi
        type: emptyDir
        targetSelector:
          main:
            main:
              mountPath: /nltk_data
    dependencies:
      postgresql:
        operator:
          cluster:
            # PG18 migration, phase 2/4: chart 29 values layout; still pinned to PG16 trixie.
            # CNPG in-place major upgrades run the old binaries inside the new image, so both
            # must share an OS base; legacy 16.15 (bullseye, libssl1.1) cannot upgrade into
            # 18-standard-trixie. See staging incident 2026-11-26.
            imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:c1d2ebeaf7b254264bdb63997270cc9d5e007ba5be4efe6112ae801d1ad68118
            instances: 2
            resources:
              limits: {}
              requests: {}
            storage:
              size: 3Gi
            walStorage:
              size: 3Gi
