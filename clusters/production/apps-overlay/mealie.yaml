apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  chart:
    spec:
      version: "27.15.0"
  values:
    mealie:
      api:
        general:
          base_url: https://mealie.stplabs.io
        oidc:
          auth_enabled: true
          signup_enabled: true
          configuration_url: https://oidc.stplabs.io/.well-known/openid-configuration
          client_id: mealie
          admin_group: admins
          provider_name: Authelia
          remember_me: true
          auto_redirect: true
    ingress:
      main:
        hosts:
          - host: mealie.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mealie.stplabs.io
            secretName: mealie-tls
    credentials:
      rustfs:
        path: "prod"
    persistence:
      data:
        size: 1Gi
        retain: true
        targetSelector:
          main:
            main:
              mountPath: /app/data
      nltk:
        enabled: true
        retain: true
        size: 1Gi
        type: emptyDir
        targetSelector:
          main:
            main:
              mountPath: /nltk_data
    cnpg:
      main:
        cluster:
          instances: 2
          resources:
            limits: {}
            requests: {}
          storage:
            size: 3Gi
          walStorage:
            size: 3Gi
