apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/sso
  - redis.yaml
patches:
  - target:
      kind: HelmRelease
      name: authelia
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: authelia
        namespace: authelia
      spec:
        values:
          pod:
            replicas: 2
            selectors:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: authelia
                        topologyKey: kubernetes.io/hostname
            env:
              - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
                value: /secrets/db/password
              - name: AUTHELIA_SESSION_REDIS_PASSWORD_FILE
                value: /secrets/redis/password
              - name: AUTHELIA_SESSION_REDIS_HIGH_AVAILABILITY_SENTINEL_PASSWORD_FILE
                value: /secrets/redis/password
              - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
                value: /secrets/lldap/password
              - name: AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
                value: /secrets/smtp/password
            extraVolumes:
              - name: authelia-files
                secret:
                  secretName: authelia-secret
                  items:
                    - key: oidc.jwk.RS256.pem
                      path: oidc.jwk.RS256.pem
              - name: db-password
                secret:
                  secretName: authelia-db-app
                  items:
                    - key: password
                      path: password
              - name: assets
                configMap:
                  name: authelia-assets
              - name: redis-password
                secret:
                  secretName: authelia-redis-secret
                  items:
                    - key: password
                      path: password
              - name: lldap-password
                secret:
                  secretName: lldap-secret
                  items:
                    - key: admin_password
                      path: password
              - name: smtp-password
                secret:
                  secretName: authelia-smtp-secret
                  items:
                    - key: password
                      path: password
            extraVolumeMounts:
              - name: authelia-files
                mountPath: /secrets/oidc.jwk.RS256.pem
                subPath: oidc.jwk.RS256.pem
                readOnly: true
              - name: db-password
                mountPath: /secrets/db
                readOnly: true
              - name: assets
                mountPath: /config/assets
                readOnly: true
              - name: redis-password
                mountPath: /secrets/redis
                readOnly: true
              - name: lldap-password
                mountPath: /secrets/lldap
                readOnly: true
              - name: smtp-password
                mountPath: /secrets/smtp
                readOnly: true
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          configMap:
            session:
              cookies:
                - domain: stplabs.io
                  subdomain: oidc
              redis:
                enabled: true
                host: authelia-redis.authelia.svc.cluster.local
                port: 26379
                password:
                  disabled: true
                high_availability:
                  enabled: true
                  sentinel_name: mymaster
                  password:
                    disabled: true
            authentication_backend:
              file:
                enabled: false
              ldap:
                enabled: true
                implementation: lldap
                address: ldap://lldap.authelia.svc.cluster.local:3890
                base_dn: dc=stplabs,dc=io
                additional_users_dn: ou=people
                additional_groups_dn: ou=groups
                user: uid=admin,ou=people,dc=stplabs,dc=io
                password:
                  disabled: true
            notifier:
              disable_startup_check: true
              filesystem:
                enabled: false
              smtp:
                enabled: true
                address: submission://smtp.gmail.com:587
                sender: "Authelia <noreply@stplabs.io>"
                username: patrick@stplabs.io
                password:
                  disabled: true
            identity_providers:
              oidc:
                clients:
                  - client_id: mealie
                    client_name: Mealie
                    client_secret:
                      value: '$6$bD.ibPj2sW9L.t75$4vCBGxM9OJlF3EKVJU5g2dii0mFMMHsIYAo4ONbKdttgT8k9BgVfW55EXXEZhfG9kkMdWPNLSNfQNo44ycc5E.'
                    public: false
                    consent_mode: implicit
                    authorization_policy: two_factor
                    redirect_uris:
                      - https://mealie.stplabs.io/login
                      - 'https://mealie.stplabs.io/login?direct=1'
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
                  - client_id: grafana
                    client_name: Grafana
                    client_secret:
                      value: '$6$n8Q5OkiFBC7XLP7v$wNrGmu53t6pspBUzRKvqM4bnkwzkc/9TabtlqpHQ8kIdUmPCwQzgZJW4B5neI46nhfVGf0jz13oua13YWo3kP1'
                    public: false
                    consent_mode: implicit
                    authorization_policy: two_factor
                    claims_policy: grafana
                    redirect_uris:
                      - https://grafana.stplabs.io/login/generic_oauth
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
  # ---- CNPG database HA (authelia + lldap) ----
  - target:
      kind: Cluster
      name: authelia-db
    patch: |
      - op: replace
        path: /spec/instances
        value: 3
  - target:
      kind: Cluster
      name: lldap-db
    patch: |
      - op: replace
        path: /spec/instances
        value: 3
  # ---- lldap: prod web UI base URL + ingress host ----
  - target:
      kind: Deployment
      name: lldap
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lldap
        namespace: authelia
      spec:
        template:
          spec:
            containers:
              - name: lldap
                env:
                  - name: LLDAP_HTTP_URL
                    value: https://lldap.stplabs.io
  - target:
      kind: Ingress
      name: lldap
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: lldap.stplabs.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lldap.stplabs.io
  # ---- theme-proxy HA (replicas + anti-affinity) ----
  - target:
      kind: Deployment
      name: authelia-theme-proxy
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authelia-theme-proxy
        namespace: authelia
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: authelia-theme-proxy
                      topologyKey: kubernetes.io/hostname
  # ---- prod ingress host + hotpink theme ----
  - target:
      kind: Ingress
      name: authelia-theme-proxy
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: oidc.stplabs.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: oidc.stplabs.io
  - target:
      kind: ConfigMap
      name: authelia-theme
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: authelia-theme
        namespace: authelia
      data:
        theme.css: |
          @import url("https://theme-park.dev/css/base/authelia/hotpink.css");
  - target:
      kind: Cluster
      name: authelia-db
    patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/destinationPath
        value: s3://cnpg-authelia/production/authelia/cnpg
  - target:
      kind: Cluster
      name: lldap-db
    patch: |
      - op: replace
        path: /spec/backup/barmanObjectStore/destinationPath
        value: s3://cnpg-lldap/production/lldap/cnpg
