---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-base
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base
  prune: false
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
    - name: infra-base
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/config
  prune: true
  wait: true
  patches:
    - target:
        kind: IPAddressPool
        group: metallb.io
        name: ip-address-pool
      patch: |
        - op: add
          path: /spec
          value:
            addresses:
            - "10.120.1.200/29"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-operators
  namespace: flux-system
spec:
  dependsOn:
    - name: repositories
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators
  prune: false
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-operators
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage
  prune: false
  wait: true
  patches:
    - target:
        kind: Ingress
        name: rook-ceph
      patch: |
        - op: replace
          path: /spec/rules/0/host
          value: rook-ceph.staging.stplabs.io
        - op: replace
          path: /spec/tls/0/hosts/0
          value: rook-ceph.staging.stplabs.io

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-oidc
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-storage
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/staging/sso
  prune: false
  wait: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-storage
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/monitoring
  prune: true
  wait: true
  patches:
    - target:
        kind: Ingress
        name: grafana
      patch: |
        - op: replace
          path: /spec/rules/0/host
          value: grafana.staging.stplabs.io
        - op: replace
          path: /spec/tls/0/hosts/0
          value: grafana.staging.stplabs.io
    - target:
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
          namespace: monitoring
        spec:
          values:
            prometheus:
              prometheusSpec:
                externalLabels:
                  k8s_cluster: staging
                retention: 7d
                retentionSize: 14GiB
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      resources:
                        requests:
                          storage: 20Gi
            grafana:
              deploymentStrategy:
                type: Recreate
              envValueFrom:
                GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
                  secretKeyRef:
                    name: grafana-oidc-secret
                    key: clientSecret
              grafana.ini:
                server:
                  root_url: https://grafana.staging.stplabs.io
                auth.generic_oauth:
                  enabled: true
                  name: Authelia
                  allow_sign_up: true
                  auto_login: true
                  client_id: grafana
                  scopes: openid profile email groups
                  auth_url: https://oidc.staging.stplabs.io/api/oidc/authorization
                  token_url: https://oidc.staging.stplabs.io/api/oidc/token
                  api_url: https://oidc.staging.stplabs.io/api/oidc/userinfo
                  login_attribute_path: preferred_username
                  groups_attribute_path: groups
                  role_attribute_path: "contains(groups, 'admins') && 'GrafanaAdmin' || 'Viewer'"
                  allow_assign_grafana_admin: true
    - target:
        kind: HelmRelease
        name: alloy
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: alloy
          namespace: monitoring
        spec:
          values:
            alloy:
              extraEnv:
                - name: K8S_CLUSTER
                  value: staging
                - name: LOKI_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: vm-write-creds
                      key: username
                - name: LOKI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vm-write-creds
                      key: password

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-monitoring
    - name: apps
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/staging/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
