---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-redis
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      version: "20.13.4"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      security:
        allowInsecureImages: true
    architecture: standalone
    auth:
      enabled: true
      existingSecret: authelia-redis-secret
      existingSecretPasswordKey: password
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
      tag: 7.4.3-debian-12-r0
    master:
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 1Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    replica:
      replicaCount: 0
