apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mealie-cnpg-main
  namespace: mealie
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-mealie/staging/mealie/cnpg
    endpointURL: https://rustfs.core.stplabs.io
    serverName: mealie-cnpg-main
    s3Credentials:
      accessKeyId:
        name: mealie-backup-secret
        key: accessKey
      secretAccessKey:
        name: mealie-backup-secret
        key: secretKey
    data:
      compression: bzip2
      jobs: 2
    wal:
      compression: bzip2
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: us-east-1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-cnpg-main-daily
  namespace: mealie
spec:
  cluster:
    name: mealie-cnpg-main
  schedule: "0 0 0 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  backupOwnerReference: self
  immediate: false
