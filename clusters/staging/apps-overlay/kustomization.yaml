apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps
  - ../../../apps/mealie-ai-config
  - ../../../apps/mealie-gkeep-sync
  - ../../../apps/opengym
  - home-assistant-backup.yaml
  - home-assistant-cnpg-backup.yaml
  - mealie-cnpg-backup.yaml
patches:
  - path: mealie.yaml
    target:
      kind: HelmRelease
      name: mealie
  # Chart >=29 reads the DB password from dependencies.postgresql.depconfig.password
  # (base still targets cnpg.main.password for prod on chart 27.x)
  - target:
      kind: HelmRelease
      name: mealie
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: Secret
          name: mealie-db-secret
          valuesKey: password
          targetPath: dependencies.postgresql.depconfig.password
  - path: home-assistant.yaml
    target:
      kind: HelmRelease
      name: home-assistant
  - path: mealie-gkeep-sync.yaml
    target:
      kind: HelmRelease
      name: mealie-gkeep-sync
  - path: opengym.yaml
    target:
      kind: HelmRelease
      name: opengym
