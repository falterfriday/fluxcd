apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps
  - ../../../apps/litellm
  - ../../../apps/mealie-ai-config
patches:
  - path: mealie.yaml
    target:
      kind: HelmRelease
      name: mealie
  - path: home-assistant.yaml
    target:
      kind: HelmRelease
      name: home-assistant
