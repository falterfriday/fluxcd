  name: mealie
  namespace: mealie
spec:
  values:
    persistence:
      data:
        size: 1Gi
    credentials:
      rustfs:
        path: "staging"
    cnpg:
      main:
        cluster:
          storage:
            size: 1Gi
          walStorage:
            size: 1Gi
