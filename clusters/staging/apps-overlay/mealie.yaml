apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  values:
    ingress:
      main:
        hosts:
          - host: mealie.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mealie.staging.stplabs.io
            secretName: mealie-tls
    persistence:
      data:
        size: 1Gi
    credentials:
      rustfs:
        path: "staging"
    cnpg:
      main:
        cluster:
          storage:
            size: 1Gi
          walStorage:
            size: 1Gi
