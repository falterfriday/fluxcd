apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  values:
    mealie:
      api:
        general:
          base_url: https://mealie.staging.stplabs.io
        oidc:
          auth_enabled: true
          signup_enabled: true
          # Authentik on the core cluster (per-application issuer, slug mealie-staging)
          configuration_url: https://sso.core.stplabs.io/application/o/mealie-staging/.well-known/openid-configuration
          client_id: mealie-staging
          user_group: platform-users
          admin_group: platform-admins
          provider_name: STP Labs
          remember_me: true
          auto_redirect: true
    ingress:
      main:
        hosts:
          - host: mealie.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mealie.staging.stplabs.io
            secretName: mealie-tls
    persistence:
      data:
        size: 1Gi
    credentials:
      rustfs:
        path: "staging"
    cnpg:
      main:
        cluster:
          storage:
            size: 1Gi
          walStorage:
            size: 1Gi
