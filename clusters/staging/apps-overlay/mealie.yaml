apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  values:
    mealie:
      api:
        general:
          base_url: https://mealie.staging.stplabs.io
        oidc:
          auth_enabled: true
          signup_enabled: true
          configuration_url: https://sso.core.stplabs.io/application/o/mealie-staging/.well-known/openid-configuration
          client_id: mealie-staging
          user_group: platform-users
          admin_group: platform-admins
          provider_name: STP Labs
          remember_me: true
          auto_redirect: true
    ingress:
      main:
        hosts:
          - host: mealie.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mealie.staging.stplabs.io
            secretName: mealie-tls
    persistence:
      data:
        size: 1Gi
    # Chart >=29 moved CNPG config from cnpg.main to dependencies.postgresql.operator;
    # cnpg.main.* is silently ignored there (it rendered 100Gi PVCs and a placeholder DB password).
    dependencies:
      postgresql:
        operator:
          cluster:
            # Pinned to PG16 on trixie to recover from the failed 16->18 major upgrade
            # (legacy bullseye 16.15 binaries can't run inside the trixie 18 image: libssl.so.1.1).
            # Remove once healthy to let the 16-trixie -> 18-trixie upgrade proceed.
            imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:c1d2ebeaf7b254264bdb63997270cc9d5e007ba5be4efe6112ae801d1ad68118
            storage:
              size: 1Gi
            walStorage:
              size: 1Gi
