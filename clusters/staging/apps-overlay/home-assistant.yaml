apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  chart:
    spec:
      version: "32.0.6"
  valuesFrom:
    - kind: Secret
      name: home-assistant-db-secret
      valuesKey: password
      targetPath: cnpg.main.password
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: accessKey
      targetPath: credentials.rustfs.accessKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: secretKey
      targetPath: credentials.rustfs.secretKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: encrKey
      targetPath: credentials.rustfs.encrKey
  values:
    image:
      repository: git.core.stplabs.io/stp-labs/home-assistant
      tag: "2026.10.3@sha256:d5feb4cbc04cdf64e8a2955138e46a82c740b7b59a31e25a654aa2255cbfe6c2"
    ingress:
      main:
        hosts:
          - host: home-assistant.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - home-assistant.staging.stplabs.io
            secretName: home-assistant-tls
    credentials:
      rustfs:
        type: s3
        url: https://rustfs.core.stplabs.io
        bucket: cnpg-home-assistant
        path: "staging"
        region: us-east-1
    cnpg:
      main:
        cluster:
          storage:
            size: 5Gi
          walStorage:
            size: 5Gi
        backups:
          enabled: true
          credentials: rustfs
          retentionPolicy: "30d"
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
