apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  chart:
    spec:
      version: "32.0.6"
  valuesFrom:
    - kind: Secret
      name: home-assistant-db-secret
      valuesKey: password
      targetPath: cnpg.main.password
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: accessKey
      targetPath: credentials.rustfs.accessKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: secretKey
      targetPath: credentials.rustfs.secretKey
    - kind: Secret
      name: home-assistant-backup-secret
      valuesKey: encrKey
      targetPath: credentials.rustfs.encrKey
  values:
    image:
      repository: git.core.stplabs.io/stp-labs/home-assistant
      tag: "2026.10.3@sha256:d5feb4cbc04cdf64e8a2955138e46a82c740b7b59a31e25a654aa2255cbfe6c2"
    persistence:
      packages:
        enabled: true
        type: configmap
        objectName: home-assistant-packages
        expandObjectName: false
        mountPath: /config/packages
        readOnly: true
        targetSelector:
          main:
            main: {}
    configmap:
      init:
        data:
          configuration.yaml.default: |-
            default_config:
            homeassistant:
              packages: !include_dir_named packages
            automation: !include automations.yaml
            script: !include scripts.yaml
            scene: !include scenes.yaml
            recorder:
              db_url: ""
          init.sh: |-
            #!/bin/sh
            set -e
            cp /config/init/configuration.yaml.default /config/configuration.yaml
            yq -i '.recorder.db_url = "{{ printf "%s?client_encoding=utf8" ($.Values.cnpg.main.creds.std | trimAll "\"") }}"' /config/configuration.yaml
            for f in automations.yaml scripts.yaml scenes.yaml; do
              [ -f "/config/$f" ] || touch "/config/$f"
            done
    ingress:
      main:
        hosts:
          - host: home-assistant.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - home-assistant.staging.stplabs.io
            secretName: home-assistant-tls
    credentials:
      rustfs:
        type: s3
        url: https://rustfs.core.stplabs.io
        bucket: cnpg-home-assistant
        path: "staging"
        region: us-east-1
    cnpg:
      main:
        cluster:
          storage:
            size: 5Gi
          walStorage:
            size: 5Gi
        backups:
          enabled: true
          credentials: rustfs
          retentionPolicy: "30d"
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
