apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  chart:
    spec:
      version: "32.0.6"
  valuesFrom:
    - kind: Secret
      name: home-assistant-db-secret
      valuesKey: password
      targetPath: cnpg.main.password
  values:
    image:
      repository: git.core.stplabs.io/stp-labs/home-assistant
      tag: "2026.10.3@sha256:d5feb4cbc04cdf64e8a2955138e46a82c740b7b59a31e25a654aa2255cbfe6c2"
    ingress:
      main:
        hosts:
          - host: home-assistant.staging.stplabs.io
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - home-assistant.staging.stplabs.io
            secretName: home-assistant-tls
    cnpg:
      main:
        cluster:
          storage:
            size: 5Gi
          walStorage:
            size: 5Gi
