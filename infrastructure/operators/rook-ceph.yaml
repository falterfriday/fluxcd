---
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    kubernetes.io/metadata.name: rook-ceph

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      version: "v1.17.7"
  values:
    resources:
    discover:
      wipeDevicesFromOtherClusters: true
    csi:
      enableCephfsDriver: false
      csiRBDProvisionerResource: |
        - name: csi-provisioner
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name: csi-resizer
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name: csi-attacher
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name: csi-snapshotter
          resource:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
        - name: csi-rbdplugin
          resource:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
        - name: csi-omap-generator
          resource:
            requests:
              memory: 256Mi
              cpu: 125m
            limits:
              memory: 512Mi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
      csiRBDPluginResource: |
        - name: driver-registrar
          resource:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
        - name: csi-rbdplugin
          resource:
            requests:
              memory: 256Mi
              cpu: 125m
            limits:
              memory: 512Mi
        - name: liveness-prometheus
          resource:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
