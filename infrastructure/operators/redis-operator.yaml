---
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
  labels:
    kubernetes.io/metadata.name: redis-operator

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: redis-operator
      version: "0.9.1"
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
