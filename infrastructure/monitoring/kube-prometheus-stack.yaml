---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    kubernetes.io/metadata.name: monitoring

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=65.0.0 <70.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    grafana:
      enabled: true
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: ceph-block
        size: 2Gi
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
    prometheus-node-exporter:
      tolerations:
        - operator: Exists
    prometheus:
      prometheusSpec:
        retention: 30d
        additionalAlertManagerConfigsSecret:
          name: alertmanager-remote
          key: alertmanager-configs.yaml
        remoteWrite:
          - url: https://telemetry.core.stplabs.io/api/v1/write
            name: core-vm
            basicAuth:
              username:
                name: vm-write-creds
                key: username
              password:
                name: vm-write-creds
                key: password
            queueConfig:
              capacity: 10000
              maxShards: 10
              minShards: 1
              maxSamplesPerSend: 2000
              batchSendDeadline: 5s
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 5Gi
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    alertmanager:
      enabled: false
    kubeEtcd:
      service:
        targetPort: 2381
      serviceMonitor:
        scheme: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: grafana.patch.stplabs.io
    http:
      paths:
      - backend:
          service:
            name: kube-prometheus-stack-grafana
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - grafana.patch.stplabs.io
    secretName: grafana-tls
