---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lldap-db-daily
  namespace: authelia
spec:
  cluster:
    name: lldap-db
  method: barmanObjectStore
  backupOwnerReference: self
  schedule: "0 45 0 * * *"
  # No immediate run: infra-secrets applies after infra-oidc, so the
  # credentials secret does not exist yet at creation time.
  suspend: false
