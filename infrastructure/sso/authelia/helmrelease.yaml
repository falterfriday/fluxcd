apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.6"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    secret:
      existingSecret: authelia-secret
    ingress:
      enabled: false
    pod:
      kind: Deployment
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      env:
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
          value: /secrets/db/password
      extraVolumes:
        - name: authelia-files
          secret:
            secretName: authelia-secret
            items:
              - key: oidc.jwk.RS256.pem
                path: oidc.jwk.RS256.pem
              - key: users_database.yml
                path: users_database.yml
        - name: db-password
          secret:
            secretName: authelia-db-app
            items:
              - key: password
                path: password
        - name: assets
          configMap:
            name: authelia-assets
      extraVolumeMounts:
        - name: authelia-files
          mountPath: /secrets/oidc.jwk.RS256.pem
          subPath: oidc.jwk.RS256.pem
          readOnly: true
        - name: authelia-files
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
        - name: db-password
          mountPath: /secrets/db
          readOnly: true
        - name: assets
          mountPath: /config/assets
          readOnly: true

    configMap:
      theme: dark
      server:
        asset_path: /config/assets
        headers:
          # Relaxed CSP so the browser may load the theme.park stylesheet
          # (injected by theme-proxy) from theme-park.dev. ${NONCE} is
          # substituted by Authelia per-request.
          csp_template: "default-src 'self'; style-src 'self' 'nonce-${NONCE}' 'unsafe-inline' theme-park.dev raw.githubusercontent.com use.fontawesome.com; img-src 'self' theme-park.dev raw.githubusercontent.com data:; script-src 'self' 'unsafe-inline'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; font-src use.fontawesome.com;"
      access_control:
        default_policy: one_factor
      session:
        cookies:
          - domain: staging.stplabs.io
            subdomain: oidc
      storage:
        postgres:
          enabled: true
          address: tcp://authelia-db-rw:5432
          database: authelia
          username: authelia
          password:
            disabled: true
          tls:
            enabled: true
            skip_verify: true
            server_name: authelia-db-rw
      notifier:
        filesystem:
          enabled: true
      authentication_backend:
        file:
          enabled: true
          watch: true
      identity_providers:
        oidc:
          enabled: true
          claims_policies:
            grafana:
              id_token:
                - groups
                - email
                - email_verified
                - preferred_username
                - name
          jwks:
            - key_id: default
              algorithm: RS256
              use: sig
              key:
                path: /secrets/oidc.jwk.RS256.pem
          clients:
            - client_id: mealie
              client_name: Mealie (staging)
              client_secret:
                value: '$6$/2KT0iY.5KDzXaaM$0Hi.STYgeOpE6ngXclnfGAwbFdn8i1toVM1ziGcBQFtZTJq277PyQINL3od5xWBXBzPxZReQB0StGu2nKFHyL1'
              public: false
              consent_mode: implicit
              authorization_policy: one_factor
              redirect_uris:
                - https://mealie.staging.stplabs.io/login
                - 'https://mealie.staging.stplabs.io/login?direct=1'
              scopes:
                - openid
                - profile
                - email
                - groups
            - client_id: grafana
              client_name: Grafana (staging)
              client_secret:
                value: '$6$/vtu/5H8QFlYTw8g$87irORiTzuh6IMBINP5Sw.iFoTcasS2hGNY5pHesOLpxtI4E0KbP6svmHMMJdxbZZKtepMmI2Fn9060z6eYfy1'
              public: false
              consent_mode: implicit
              authorization_policy: one_factor
              claims_policy: grafana
              redirect_uris:
                - https://grafana.staging.stplabs.io/login/generic_oauth
              scopes:
                - openid
                - profile
                - email
                - groups
