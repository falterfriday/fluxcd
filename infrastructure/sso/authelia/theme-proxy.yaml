---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-theme-proxy
  namespace: authelia
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      server {
        listen 8080;
        server_name _;

        location / {
          proxy_pass http://authelia.authelia.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          # TLS is terminated at the ingress (force-ssl-redirect); tell Authelia
          # it is behind HTTPS so it builds correct URLs / secure cookies.
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          # Disable upstream compression so sub_filter can rewrite the body.
          proxy_set_header Accept-Encoding "";
          proxy_redirect off;

          # Inject the Aquamarine stylesheet. Scoped to text/html only, so OIDC
          # JSON endpoints (/api/oidc/*, /jwks.json, /.well-known/*) are untouched.
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="https://theme-park.dev/css/base/authelia/aquamarine.css"></head>';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-theme-proxy
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia-theme-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia-theme-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia-theme-proxy
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: authelia-theme-proxy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-theme-proxy
  namespace: authelia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authelia-theme-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia-theme-proxy
  namespace: authelia
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: oidc.staging.stplabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia-theme-proxy
                port:
                  number: 80
  tls:
    - hosts:
        - oidc.staging.stplabs.io
      secretName: authelia-tls
