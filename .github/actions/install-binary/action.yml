---
name: Install pinned binary
description: >-
  Download a release archive, verify its SHA-256, and install one binary from it
  onto PATH. Every third-party tool in this repository's CI arrives this way:
  pinned by version and verified by checksum, so a compromised or re-cut release
  fails the job instead of silently changing what a security check does.

inputs:
  name:
    description: Name of the binary to install (also the member extracted from the archive).
    required: true
  url:
    description: URL of the .tar.gz release archive.
    required: true
  sha256:
    description: Expected SHA-256 of the downloaded archive.
    required: true
  member:
    description: Path of the binary inside the archive, when it differs from `name`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install binary
      shell: bash
      env:
        BINARY_NAME: ${{ inputs.name }}
        BINARY_URL: ${{ inputs.url }}
        BINARY_SHA256: ${{ inputs.sha256 }}
        BINARY_MEMBER: ${{ inputs.member }}
      run: |
        set -euo pipefail
        workdir="$(mktemp -d)"
        archive="${workdir}/download.tar.gz"

        curl -sSLo "$archive" "$BINARY_URL"
        echo "${BINARY_SHA256}  ${archive}" | sha256sum -c -

        member="${BINARY_MEMBER:-$BINARY_NAME}"
        tar -xzf "$archive" -C "$workdir" "$member"
        sudo install -m 0755 "${workdir}/${member}" "/usr/local/bin/${BINARY_NAME}"

        "$BINARY_NAME" --version 2>/dev/null || true
