---
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — catches newly-published advisories against unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  KYVERNO_URL: https://github.com/kyverno/kyverno/releases/download/v1.19.0/kyverno-cli_v1.19.0_linux_x86_64.tar.gz
  KYVERNO_SHA256: f5b4dc73c8e2f3f66e8e0034dc370e6eb6c4617eff7d5ae3838d2200034eb421
  TRIVY_URL: https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
  ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
  KUSTOMIZE_URL: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  FLUX_VERSION: 2.9.3

jobs:
  # --- Blocking ------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/install-binary
        with:
          name: gitleaks
          url: ${{ env.GITLEAKS_URL }}
          sha256: ${{ env.GITLEAKS_SHA256 }}

      - name: Scan working tree
        run: gitleaks dir . -c .gitleaks.toml --redact --no-banner

      - name: Scan full history
        run: gitleaks git . -c .gitleaks.toml --redact --no-banner

  manifest-security:
    name: manifest policy and misconfiguration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c  # v2.9.4 (action), CLI pinned by FLUX_VERSION
        with:
          version: ${{ env.FLUX_VERSION }}

      - uses: ./.github/actions/install-binary
        with:
          name: kustomize
          url: ${{ env.KUSTOMIZE_URL }}
          sha256: ${{ env.KUSTOMIZE_SHA256 }}

      - uses: ./.github/actions/install-binary
        with:
          name: kyverno
          url: ${{ env.KYVERNO_URL }}
          sha256: ${{ env.KYVERNO_SHA256 }}

      - uses: ./.github/actions/install-binary
        with:
          name: trivy
          url: ${{ env.TRIVY_URL }}
          sha256: ${{ env.TRIVY_SHA256 }}

      - name: Render manifests
        run: .github/scripts/render-all.sh "${RUNNER_TEMP}/rendered"

      - name: Kyverno policies
        run: python3 .github/scripts/run-policies.py "${RUNNER_TEMP}/rendered"

      - name: Chart digest provenance
        run: python3 .github/scripts/chart-digests.py "${RUNNER_TEMP}/rendered"

      - name: Trivy misconfiguration scan
        run: |
          set -euo pipefail
          trivy config "${RUNNER_TEMP}/rendered" \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --format sarif --output trivy-config.sarif \
            --exit-code 0
          trivy config "${RUNNER_TEMP}/rendered" \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --format table \
            --exit-code 0 | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload Trivy SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e  # v4.32.4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # --- Reporting -----------------------------------------------------------
  workflow-audit:
    name: workflow hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-binary
        with:
          name: zizmor
          url: ${{ env.ZIZMOR_URL }}
          sha256: ${{ env.ZIZMOR_SHA256 }}

      - name: Audit workflows
        run: |
          set -euo pipefail
          zizmor --persona=regular --format sarif .github/ > zizmor.sarif || true
          zizmor --persona=regular --format plain .github/ | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload zizmor SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e  # v4.32.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  renovate-config:
    name: renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate renovate.json5
        run: npx --yes --package renovate -- renovate-config-validator --strict
