---
name: backup-check

# Daily verification that every CloudNativePG database is both backed up and
# recently backed up.
#
# The coverage half is the point: a database with no ScheduledBackup raises no
# alert, because nothing is failing — there is simply no backup. Monitoring
# cannot see the absence of a thing.
#
# Requires a self-hosted runner with cluster access.

on:
  schedule:
    # 06:30 UTC daily, after the 00:00 backup window has settled.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backups:
    name: backups (${{ matrix.cluster }})
    runs-on: [self-hosted, fluxcd]
    strategy:
      fail-fast: false
      matrix:
        cluster: [staging, production]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify backup coverage and freshness
        env:
          CLUSTER: ${{ matrix.cluster }}
        run: python3 .github/scripts/check-backups.py "$CLUSTER"
