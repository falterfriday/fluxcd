---
name: drift-detection

# Daily comparison of live cluster state against this repository.
#
# This matters more here than in most GitOps setups: almost every Flux
# Kustomization runs with `prune: false`, so a resource deleted from git keeps
# running in the cluster and nothing reports it. Drift is otherwise invisible
# until it causes an incident.
#
# Requires a self-hosted runner with kubeconfig contexts 'staging' and
# 'production' — the cluster endpoints are RFC1918 and unreachable from
# GitHub-hosted runners.

on:
  schedule:
    # 05:00 UTC daily, before the working day.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: drift (${{ matrix.cluster }})
    runs-on: [self-hosted, fluxcd]
    strategy:
      # Both clusters are always checked, even if one is unreachable.
      fail-fast: false
      matrix:
        cluster: [staging, production]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml

      - name: Check drift
        env:
          CLUSTER: ${{ matrix.cluster }}
        run: .github/scripts/check-drift.sh "$CLUSTER"
