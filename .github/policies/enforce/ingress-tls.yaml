---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ingress-tls
  annotations:
    policies.kyverno.io/title: Ingress must terminate TLS
    policies.kyverno.io/severity: high
spec:
  background: false
  rules:
    - name: ingress-must-declare-tls
      match:
        any:
          - resources:
              kinds: [Ingress]
      validate:
        failureAction: Enforce
        message: "Ingress must declare spec.tls with at least one host."
        pattern:
          spec:
            tls:
              - hosts:
                  - "?*"
