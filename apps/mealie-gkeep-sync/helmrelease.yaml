---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie-gkeep-sync
  namespace: mealie
spec:
  interval: 30m
  chart:
    spec:
      chart: mealie-gkeep-sync
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: mealie-gkeep-sync
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mealie:
      baseUrl: http://mealie.mealie.svc.cluster.local:10018
      listName: Mealie List
    google:
      email: mealie.gkeep.sync@gmail.com
      keepListName: Mealie List
      createListIfMissing: false
    secrets:
      existingSecret: mealie-gkeep-sync-secret
    sync:
      intervalSeconds: 60
      conflictStrategy: newest
      dryRun: false
    persistence:
      enabled: true
      size: 128Mi
    logging:
      level: INFO
      format: json
