apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-ai-config
  namespace: mealie
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie-ai-config
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: python:3.12-alpine
          command: ["python", "/scripts/reconcile.py"]
          env:
            - name: MEALIE_URL
              value: http://mealie.mealie.svc.cluster.local:10018
            - name: PROVIDER_NAME
              value: claude-via-litellm
            - name: PROVIDER_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: PROVIDER_MODEL
              value: claude-haiku-4-5
            - name: PROVIDER_TIMEOUT
              value: "120"
          envFrom:
            - secretRef:
                name: mealie-ai-config-secret
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      volumes:
        - name: script
          configMap:
            name: mealie-ai-config-script
