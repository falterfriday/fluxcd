apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: trueforge
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: home-assistant
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/control-plane
                              operator: DoesNotExist
  values:
    podOptions:
      defaultAffinity: false
    image:
      pullPolicy: Always
    workload:
      main:
        podSpec:
          hostNetwork: true
    # Replaces the chart's init: no HACS download, configuration.yaml rewritten from git on every start
    configmap:
      init:
        data:
          configuration.yaml.default: |-
            default_config:
            homeassistant:
              packages: !include_dir_named packages
            automation: !include automations.yaml
            script: !include scripts.yaml
            scene: !include scenes.yaml
            recorder:
              db_url: ""
          init.sh: |-
            #!/bin/sh
            set -e
            cp /config/init/configuration.yaml.default /config/configuration.yaml
            yq -i '.recorder.db_url = "{{ printf "%s?client_encoding=utf8" ($.Values.cnpg.main.creds.std | trimAll "\"") }}"' /config/configuration.yaml
            for f in automations.yaml scripts.yaml scenes.yaml; do
              [ -f "/config/$f" ] || touch "/config/$f"
            done
    persistence:
      config:
        enabled: true
        mountPath: /config
        retain: true
        size: 1Gi
        targetSelectAll: true
      packages:
        enabled: true
        type: configmap
        objectName: home-assistant-packages
        expandObjectName: false
        mountPath: /config/packages
        readOnly: true
        targetSelector:
          main:
            main: {}
    service:
      metrics:
        enabled: false
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "100m"
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
