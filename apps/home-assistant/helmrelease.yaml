apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: home-assistant
      sourceRef:
        kind: HelmRepository
        name: trueforge
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    podOptions:
      defaultAffinity: false
    image:
      pullPolicy: Always
    # TEMPORARY HOTFIX (2026-10-24) - remove once HA ships a pylutron-caseta release containing
    # gurumitts/pylutron-caseta#218 (tracking: home-assistant/core#188264)
    workload:
      main:
        podSpec:
          containers:
            main:
              command:
                - /bin/sh
                - -c
                - |
                  F="$(python3 -c 'import importlib.util as u; print(u.find_spec("pylutron_caseta").submodule_search_locations[0])')/smartbridge.py"
                  V="$(python3 -c 'import importlib.metadata as m; print(m.version("pylutron-caseta"))')"
                  if [ "$V" != "0.29.0" ]; then
                    echo "caseta-hotfix: pylutron-caseta is $V, not 0.29.0 - skipping; remove this hotfix from the HelmRelease"
                  elif grep -q 'ssl_context.check_hostname = False' "$F"; then
                    echo "caseta-hotfix: already applied"
                  elif grep -q '^ *ssl_context.verify_mode = ssl.CERT_REQUIRED$' "$F"; then
                    sed -i 's/^\( *\)ssl_context.verify_mode = ssl.CERT_REQUIRED$/&\n\1ssl_context.check_hostname = False/' "$F" && echo "caseta-hotfix: applied to $F"
                  else
                    echo "caseta-hotfix: WARNING patch target not found in $F - starting unpatched"
                  fi
                  exec /init
    persistence:
      config:
        enabled: true
        mountPath: /config
        retain: true
        size: 1Gi
        targetSelectAll: true
    service:
      metrics:
        enabled: false
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-cluster-issuer
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "100m"
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "86400"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
          nginx.ingress.kubernetes.io/proxy-real-ip-cidr: "0.0.0.0/0"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
          nginx.ingress.kubernetes.io/rate-limit: "100"
          nginx.ingress.kubernetes.io/rate-limit-window: "1m"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
          nginx.ingress.kubernetes.io/websocket-services: home-assistant
