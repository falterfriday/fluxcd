apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opengym
  namespace: opengym
spec:
  interval: 30m
  chart:
    spec:
      chart: opengym
      version: "1.3.9"
      sourceRef:
        kind: HelmRepository
        name: stp-labs
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
